name: v16.2 自動ファインチューニング (パラメータ最適化＆再構築)

on:
  workflow_dispatch:
    inputs:
      max_files:
        description: '学習に使う最新JRAキャッシュ月数 (既定: 12)'
        required: false
        default: '12'
        type: string

permissions:
  contents: write

concurrency:
  group: oddmaker-data-write
  cancel-in-progress: false

jobs:
  auto-tune:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Auto Fine-Tuning & Rebuild Dashboard
        run: |
          python auto_tune.py --max-files "${{ github.event.inputs.max_files || '12' }}"
          python rebuild_dashboard.py

      - name: Commit & Push Tuned Params & Dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tuned_params.json data/cache_index.json data/CACHE_LIST.md data/wakuren_dry_run_state_v11_9.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "🔧 v16.2 自動ファインチューニング＆ダッシュボード更新"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "${GITHUB_REF_NAME}" && break
            sleep 3
          done
