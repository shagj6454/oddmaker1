name: JRA & NAR Auto Voter (v11.9 Cloud)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード (both=平日NAR/土日JRA+NAR自動判別 / nar / jra)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - nar
          - jra
      venue:
        description: '対象競馬場 (auto で直近レース自動選択 / 例: 大井, 園田, 東京)'
        required: true
        default: 'auto'
      race_num:
        description: '対象レース番号 (0 で自動選択 / 例: 5)'
        required: true
        default: '0'
      dry_run:
        description: 'テスト実行 (true=買わずにDry-run専用JSONへ記録 / false=本番投票)'
        required: true
        default: false
        type: boolean
      mock:
        description: '擬似オッズ使用 (時間外テスト用: true / 実オッズ取得: false)'
        required: true
        default: false
        type: boolean

  schedule:
    # JRA土日開催用 (土日 09:00〜16:55 JST -> UTC 00:00〜07:55) 5分おき起動
    - cron: '*/5 0-7 * * 6,0'
    # 地方競馬・楽天競馬用 (毎日 10:00〜21:55 JST -> UTC 01:00〜12:55) 5分おき起動
    - cron: '*/5 1-12 * * *'

permissions:
  contents: write

concurrency:
  group: auto-vote-lock
  cancel-in-progress: false

jobs:
  auto-vote:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 1. リポジトリのコードを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. タイムゾーンを日本時間 (JST) に設定
        run: sudo timedatectl set-timezone Asia/Tokyo

      - name: 3. Python 3.11 のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 4. ライブラリとブラウザ (Playwright) のインストール
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: 5. 自動投票スクリプトの実行
        env:
          JRA_INET_ID: ${{ secrets.JRA_INET_ID }}
          JRA_SUBSCRIBER_NO: ${{ secrets.JRA_SUBSCRIBER_NO }}
          JRA_PARS_NO: ${{ secrets.JRA_PARS_NO }}
          JRA_PIN: ${{ secrets.JRA_PIN }}
          RAKUTEN_USER_ID: ${{ secrets.RAKUTEN_USER_ID }}
          RAKUTEN_PASSWORD: ${{ secrets.RAKUTEN_PASSWORD }}
          RAKUTEN_VOTE_PIN: ${{ secrets.RAKUTEN_VOTE_PIN }}
        run: |
          mkdir -p src data logs
          cp -f *.py src/
          MODE="${{ github.event.inputs.mode || 'both' }}"
          VENUE="${{ github.event.inputs.venue || 'auto' }}"
          RNUM="${{ github.event.inputs.race_num || '0' }}"
          Flags="--headless"
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            Flags="$Flags --dry-run"
          fi
          if [ "${{ github.event.inputs.mock }}" == "true" ]; then
            Flags="$Flags --mock"
          fi
          cd src
          python3 execute_vote.py --mode "$MODE" --venue "$VENUE" --race_num "$RNUM" $Flags

      - name: 6. 戦目データ(JSON)とログをGitHubへ自動保存
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ logs/
          git diff --staged --quiet || (git commit -m "chore: Auto-update state & logs" && git pull --rebase -X ours origin main && git push)
