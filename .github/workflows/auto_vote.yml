name: JRA & NAR Auto Voter (v11.9 Cloud)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード (nar / jra / both)'
        required: true
        default: 'nar'
        type: choice
        options:
          - nar
          - jra
          - both
      race_id:
        description: '対象レースID (auto で発走直前レースを自動検出)'
        required: true
        default: 'auto'
      dry_run:
        description: 'テスト実行 (true=買わずに計算とログのみ / false=本番投票)'
        required: true
        default: false
        type: boolean
      mock:
        description: '擬似オッズ使用 (時間外テスト用: true / 実オッズ取得: false)'
        required: true
        default: false
        type: boolean

  schedule:
    - cron: '*/5 1-12 * * *'

permissions:
  contents: write

jobs:
  auto-vote:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 1. リポジトリのコードを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. タイムゾーンを日本時間 (JST) に設定
        run: sudo timedatectl set-timezone Asia/Tokyo

      - name: 3. Python 3.11 のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 4. ライブラリとブラウザ (Playwright) のインストール
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: 5. 自動投票スクリプトの実行
        env:
          JRA_INET_ID: ${{ secrets.JRA_INET_ID }}
          JRA_SUBSCRIBER_NO: ${{ secrets.JRA_SUBSCRIBER_NO }}
          JRA_PARS_NO: ${{ secrets.JRA_PARS_NO }}
          JRA_PIN: ${{ secrets.JRA_PIN }}
          RAKUTEN_USER_ID: ${{ secrets.RAKUTEN_USER_ID }}
          RAKUTEN_PASSWORD: ${{ secrets.RAKUTEN_PASSWORD }}
          RAKUTEN_VOTE_PIN: ${{ secrets.RAKUTEN_VOTE_PIN }}
        run: |
          mkdir -p src data logs
          cp -f *.py src/
          MODE="${{ github.event.inputs.mode || 'nar' }}"
          RACE_ID="${{ github.event.inputs.race_id || 'auto' }}"
          Flags="--headless"
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            Flags="$Flags --dry-run"
          fi
          if [ "${{ github.event.inputs.mock }}" == "true" ]; then
            Flags="$Flags --mock"
          fi
          cd src
          python3 execute_vote.py --mode "$MODE" --race_id "$RACE_ID" $Flags

      - name: 6. 戦目データ(JSON)とログをGitHubへ自動保存
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ logs/
          git diff --staged --quiet || (git commit -m "chore: Auto-update state & logs" && git pull --rebase origin main && git push)
