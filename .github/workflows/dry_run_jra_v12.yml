name: v13.2 JRA Dry-run シミュレーター (土日1ヶ月・3並列・購入なし)

on:
  workflow_dispatch:
    inputs:
      year:
        description: "対象年 (例: 2026)"
        required: true
        default: "2026"
        type: string
      month:
        description: "対象月 (1-12)"
        required: true
        default: "11"
        type: string
      mode:
        description: "検証モード (v12=v13.2距離枠＆脚質 / grid100=100種総当たり)"
        required: true
        default: "v12"
        type: choice
        options:
          - v12
          - grid100
      no_cache:
        description: "キャッシュを無視して再取得"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: oddmaker-data-write
  cancel-in-progress: false

jobs:
  jra-sim-v13-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install playwright
          playwright install chromium
      - name: v13.2 JRA 月次(土日) 3並列 Dry-run 実行
        run: |
          export PYTHONPATH=.
          NC=""
          if [ "${{ inputs.no_cache }}" = "true" ]; then NC="--no-cache"; fi
          python simulate_jra_v12.py --year "${{ inputs.year }}" --month "${{ inputs.month }}" --mode "${{ inputs.mode }}" --run-id "jra_${{ github.run_id }}" $NC
      - name: 結果とキャッシュを保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "🧪 v13.2 JRA 月次Dry-run (${{ inputs.year }}/${{ inputs.month }})"
            git pull --rebase -X ours origin main
            git push origin main
          fi
