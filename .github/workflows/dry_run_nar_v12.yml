name: v14.1 地方競馬(NAR) シミュレーター [Dry-run]

on:
  workflow_dispatch:
    inputs:
      year:
        description: '対象年 (2012-2026)'
        required: true
        default: '2026'
        type: string
      month:
        description: '対象月 (1-12 または all)'
        required: true
        default: '10'
        type: string
      week:
        description: '対象週 (all: 4週分割実行 / 1〜4: 指定週のみ)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - '1'
          - '2'
          - '3'
          - '4'
      venue:
        description: '対象競馬場 (all または場名 例: 大井, 園田)'
        required: true
        default: 'all'
        type: string
      mode:
        description: '検証モード (v12: v14.1標準 / grid100: 100種総当たり)'
        required: true
        default: 'v12'
        type: choice
        options:
          - v12
          - grid100
      no_cache:
        description: 'キャッシュを無視して再取得する'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: oddmaker-data-write
  cancel-in-progress: false

jobs:
  simulate-nar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright & Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run v14.1 NAR Simulator (4-Week Split & Cache Save)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          YEAR="${{ github.event.inputs.year }}"
          MONTH="${{ github.event.inputs.month }}"
          WEEK="${{ github.event.inputs.week }}"
          VENUE="${{ github.event.inputs.venue }}"
          MODE="${{ github.event.inputs.mode }}"
          NO_CACHE_FLAG=""
          if [ "${{ github.event.inputs.no_cache }}" == "true" ]; then
            NO_CACHE_FLAG="--no-cache"
          fi
          RUN_ID="nar_v14_1_${YEAR}_${MONTH}_$(date +'%Y%m%d_%H%M%S')"

          commit_and_push() {
            local MSG="$1"
            git add data/
            if ! git diff --cached --quiet; then
              git commit -m "${MSG}"
              for i in 1 2 3; do
                git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "${GITHUB_REF_NAME}" && break
                sleep 3
              done
            fi
          }

          if [ "${WEEK}" == "all" ] && [ "${MONTH}" != "all" ]; then
            for W in 1 2 3 4; do
              echo "=== Running Week ${W}/4 ==="
              python simulate_nar_v12.py                 --year "${YEAR}" --month "${MONTH}" --week "${W}"                 --venue "${VENUE}" --mode "${MODE}" --run-id "${RUN_ID}" ${NO_CACHE_FLAG}
              NO_CACHE_FLAG=""
              commit_and_push "🧪 v14.1 地方検証更新 (${YEAR}/${MONTH} 第${W}週 [${VENUE}/${MODE}])"
            done
          else
            python simulate_nar_v12.py               --year "${YEAR}" --month "${MONTH}" --week "${WEEK}"               --venue "${VENUE}" --mode "${MODE}" --run-id "${RUN_ID}" ${NO_CACHE_FLAG}
            commit_and_push "🧪 v14.1 地方検証更新 (${YEAR}/${MONTH} week=${WEEK} [${VENUE}/${MODE}])"
          fi
