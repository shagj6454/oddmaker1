name: JRA netkeiba自動投票 (v11.9 / Dry-run可)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-runモード（true=購入直前で停止 / false=実購入）"
        required: true
        default: true
        type: boolean
      ignore_time:
        description: "テスト用：発走3〜5分前以外でも直近1Rを即検証する"
        required: true
        default: true
        type: boolean

jobs:
  run-jra-v11-9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 依存ライブラリ導入
        run: |
          pip install playwright
          playwright install chromium
      - name: v11.9 自動投票実行（netkeibaオッズ＋即PAT5重フェイルセーフ）
        env:
          JRA_INET_ID: ${{ secrets.JRA_INET_ID }}
          JRA_SUBSCRIBER_NO: ${{ secrets.JRA_SUBSCRIBER_NO }}
          JRA_PIN: ${{ secrets.JRA_PIN }}
          JRA_PARS_NO: ${{ secrets.JRA_PARS_NO }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.ignore_time }}" = "true" ]; then ARGS="$ARGS --ignore-time"; fi
          python -m src.auto_voter_v11_9 $ARGS
